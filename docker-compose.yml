services:
  backend:
    build:
      context: ./backend
    container_name: thothly-backend
    ports:
      - "8000:8000"
    # Pass through .env (optional LLM_* keys, etc.); DATA_DIR below overrides any
    # host value so the container always writes to the mounted volume.
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: thothly-frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
