app = "thothly"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  # Suspend when idle: billed per running second, wakes in a few hundred ms.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# The SQLite DB (jobs and every paid-answer cache) lives in /data. Without a
# volume each deploy wipes it, and every cached transcript is bought again.
# fly deploy creates the volume on first run (about $0.15/month for 1 GB).
[mounts]
  source = "thothly_data"
  destination = "/data"
  initial_size = "1gb"
