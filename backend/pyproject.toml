[project]
name = "thothly-backend"
version = "0.0.1"
description = "Thothly backend — compile YouTube + blog sources into clean EPUBs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "pydantic-settings>=2.14.1",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
