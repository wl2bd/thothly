[project]
name = "thothly-backend"
version = "0.0.1"
description = "Thothly backend — compile YouTube + blog sources into clean EPUBs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "pydantic-settings>=2.14.1",
    "uvicorn[standard]>=0.46.0",
    "yt-dlp>=2024.1.1",
    "feedparser>=6.0.0",
    "trafilatura>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
    "openai>=1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
